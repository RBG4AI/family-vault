    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 50%, #1a202c 100%);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container { max-width: 400px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; }
        .logo { width: 60px; height: 60px; background: linear-gradient(45deg, #3b82f6, #8b5cf6); border-radius: 16px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .title { font-size: 28px; font-weight: bold; margin-bottom: 8px; }
        .subtitle { color: #a0aec0; font-size: 14px; }
        .card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 16px; }
        .card h3 { font-size: 18px; margin-bottom: 12px; }
        .input { width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 12px; color: white; font-size: 16px; margin-bottom: 12px; }
        .input::placeholder { color: #a0aec0; }
        .btn { width: 100%; background: linear-gradient(45deg, #3b82f6, #8b5cf6); border: none; border-radius: 12px; padding: 14px; color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 12px; }
        .btn:hover { opacity: 0.9; }
        .btn-secondary { background: rgba(255,255,255,0.1); }
        .list { max-height: 300px; overflow-y: auto; }
        .item { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; margin-bottom: 8px; display: flex; justify-content: between; align-items: center; }
        .item-title { font-weight: 600; }
        .item-subtitle { color: #a0aec0; font-size: 14px; }
        .delete-btn { background: #ef4444; border: none; border-radius: 8px; padding: 6px 12px; color: white; font-size: 12px; cursor: pointer; }
        .tabs { display: flex; margin-bottom: 20px; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 4px; }
        .tab { flex: 1; padding: 8px; text-align: center; border-radius: 8px; cursor: pointer; font-size: 14px; }
        .tab.active { background: rgba(59,130,246,0.3); }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🔒</div>
            <h1 class="title">Vault</h1>
            <p class="subtitle">Secure Credential Manager</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="showTab('credentials')">Credentials</div>
            <div class="tab" onclick="showTab('banking')">Banking</div>
            <div class="tab" onclick="showTab('cards')">Cards</div>
        </div>

        <div id="credentials" class="tab-content">
            <div class="card">
                <h3>Add Credential</h3>
                <input type="text" id="cred-name" class="input" placeholder="App/Website Name">
                <input type="text" id="cred-username" class="input" placeholder="Username/Email">
                <input type="password" id="cred-password" class="input" placeholder="Password">
                <button class="btn" onclick="addCredential()">Save Credential</button>
            </div>
            <div class="card">
                <h3>Saved Credentials</h3>
                <div id="cred-list" class="list"></div>
            </div>
        </div>

        <div id="banking" class="tab-content hidden">
            <div class="card">
                <h3>Add Bank Account</h3>
                <input type="text" id="bank-name" class="input" placeholder="Bank Name">
                <input type="text" id="bank-account" class="input" placeholder="Account Number">
                <input type="text" id="bank-ifsc" class="input" placeholder="IFSC Code">
                <button class="btn" onclick="addBank()">Save Bank Account</button>
            </div>
            <div class="card">
                <h3>Saved Bank Accounts</h3>
                <div id="bank-list" class="list"></div>
            </div>
        </div>

        <div id="cards" class="tab-content hidden">
            <div class="card">
                <h3>Add Card</h3>
                <input type="text" id="card-name" class="input" placeholder="Card Name">
                <input type="text" id="card-number" class="input" placeholder="Card Number">
                <input type="text" id="card-expiry" class="input" placeholder="MM/YY">
                <button class="btn" onclick="addCard()">Save Card</button>
            </div>
            <div class="card">
                <h3>Saved Cards</h3>
                <div id="card-list" class="list"></div>
            </div>
        </div>
    </div>

    <script>
        // Simple storage functions
        function saveData(key, data) {
            localStorage.setItem(key, JSON.stringify(data));
        }

        function loadData(key) {
            const data = localStorage.getItem(key);
            return data ? JSON.parse(data) : [];
        }

        function showTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
            document.getElementById(tabName).classList.remove('hidden');
            event.target.classList.add('active');
        }

        function addCredential() {
            const name = document.getElementById('cred-name').value;
            const username = document.getElementById('cred-username').value;
            const password = document.getElementById('cred-password').value;
            
            if (!name || !username || !password) return;
            
            const credentials = loadData('credentials');
            credentials.push({ id: Date.now(), name, username, password });
            saveData('credentials', credentials);
            
            document.getElementById('cred-name').value = '';
            document.getElementById('cred-username').value = '';
            document.getElementById('cred-password').value = '';
            
            displayCredentials();
        }

        function addBank() {
            const name = document.getElementById('bank-name').value;
            const account = document.getElementById('bank-account').value;
            const ifsc = document.getElementById('bank-ifsc').value;
            
            if (!name || !account) return;
            
            const banks = loadData('banking');
            banks.push({ id: Date.now(), name, account, ifsc });
            saveData('banking', banks);
            
            document.getElementById('bank-name').value = '';
            document.getElementById('bank-account').value = '';
            document.getElementById('bank-ifsc').value = '';
            
            displayBanks();
        }

        function addCard() {
            const name = document.getElementById('card-name').value;
            const number = document.getElementById('card-number').value;
            const expiry = document.getElementById('card-expiry').value;
            
            if (!name || !number) return;
            
            const cards = loadData('cards');
            cards.push({ id: Date.now(), name, number, expiry });
            saveData('cards', cards);
            
            document.getElementById('card-name').value = '';
            document.getElementById('card-number').value = '';
            document.getElementById('card-expiry').value = '';
            
            displayCards();
        }

        function deleteItem(type, id) {
            const items = loadData(type);
            const filtered = items.filter(item => item.id !== id);
            saveData(type, filtered);
            
            if (type === 'credentials') displayCredentials();
            if (type === 'banking') displayBanks();
            if (type === 'cards') displayCards();
        }

        function displayCredentials() {
            const credentials = loadData('credentials');
            const list = document.getElementById('cred-list');
            list.innerHTML = credentials.map(cred => `
                <div class="item">
                    <div>
                        <div class="item-title">${cred.name}</div>
                        <div class="item-subtitle">${cred.username}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem('credentials', ${cred.id})">Delete</button>
                </div>
            `).join('');
        }

        function displayBanks() {
            const banks = loadData('banking');
            const list = document.getElementById('bank-list');
            list.innerHTML = banks.map(bank => `
                <div class="item">
                    <div>
                        <div class="item-title">${bank.name}</div>
                        <div class="item-subtitle">****${bank.account.slice(-4)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem('banking', ${bank.id})">Delete</button>
                </div>
            `).join('');
        }

        function displayCards() {
            const cards = loadData('cards');
            const list = document.getElementById('card-list');
            list.innerHTML = cards.map(card => `
                <div class="item">
                    <div>
                        <div class="item-title">${card.name}</div>
                        <div class="item-subtitle">****${card.number.slice(-4)}</div>
                    </div>
                    <button class="delete-btn" onclick="deleteItem('cards', ${card.id})">Delete</button>
                </div>
            `).join('');
        }

        // Load data on startup
        displayCredentials();
        displayBanks();
        displayCards();
    </script>
</body>
</html>
